<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0252cc" />
      <stop offset="100%" stop-color="#003996" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8102e" />
      <stop offset="100%" stop-color="#e63946" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(5, 5)">
    <!-- Shield / Medical Circle Base -->
    <rect x="0" y="0" width="50" height="50" rx="14" fill="url(#logoGrad)" />
    
    <!-- Heartbeat / Cross symbol -->
    <path d="M 25 12 C 20 6, 12 12, 17 21 L 25 31 L 33 21 C 38 12, 30 6, 25 12 Z" fill="url(#heartGrad)" />
    <!-- Pulse Line -->
    <path d="M 12 25 L 19 25 L 22 20 L 25 29 L 28 23 L 31 25 L 38 25" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Text -->
  <text x="66" y="28" font-family="'Inter', 'Montserrat', sans-serif" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="-0.5">AASTHA</text>
  <text x="66" y="44" font-family="'Inter', 'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#0252cc" letter-spacing="1.5">DIAGNOSTIC LAB</text>
</svg>
